# 基础目录配置
meta_dir = ${DORIS_HOME}/doris-meta

# 核心通信端口
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010

# 绑定容器内部的固定网络 IP
sys_log_level = INFO

# 🌟 针对 JDK 17 的核心配置
# 将原先的 JAVA_OPTS 替换或同步给 JAVA_OPTS_FOR_JDK_17
JAVA_OPTS_FOR_JDK_17="-Dfile.encoding=UTF-8 -Djavax.security.auth.useSubjectCredsOnly=false -Xmx4096m -Xms4096m -XX:+HeapDumpOnOutOfMemoryError -XX:-UseContainerSupport --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/jdk.internal.ref=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.management/sun.management=ALL-UNNAMED --add-opens=jdk.management/com.sun.management.internal=ALL-UNNAMED"

# 为了兼容性，也可以保留一份 JAVA_OPTS
JAVA_OPTS="-Dfile.encoding=UTF-8 -Xmx4096m -Xms4096m -XX:-UseContainerSupport"

# 🌟 建议加上网络掩码，防止 Docker 内多网卡干扰
priority_networks = 172.20.80.0/24
priority_networks = 172.20.80.0/24
