services:
  oracle-db:
    image: datarepo/oracle-database-enterprise:12.2.0.1-slim
    # image: wvbirder/database-enterprise:12.2.0.1-slim
    user: oracle
    environment:
      - DB_SID=ORCL
      - DB_PDB=ORCLPDB
      - DB_PASSWD=orcl123
      - ORACLE_CHARACTERSET=AL32UTF8
      - NLS_LANG=AMERICAN_AMERICA.AL32UTF8
    ports:
      - 1521:1521
    volumes:
      # - ./init-user.sql:/init-user.sql
      - oracle-data:/opt/oracle/oradata
      - ./init-user.sh:/opt/oracle/scripts/setup/init-user.sh
      # - oracle-backup:/opt/oracle/backup
      # - PATH=/u01/app/oracle/product/12.2.0/dbhome_1/bin:$PATH
